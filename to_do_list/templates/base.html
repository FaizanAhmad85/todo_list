{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} ToDo App {% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block css %} {% endblock css %} 
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="{% url 'home' %}" class="nav-link"><div class="box">Home</div></a> 
            <a href="{% url 'todolist' %}" class="nav-link"><div class="box">To Do List</div></a>
            <a href="{% url 'contact' %}" class="nav-link"><div class="box">Contact Us</div></a>
            <a href="{% url 'about' %}" class="nav-link"><div class="box">About Us</div></a>
        </div>

        <div class="nav-right">
            {% if user.is_authenticated %}
                <span class="username-tag">Hi, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link"><div class="box login-box">Login</div></a>
                <a href="{% url 'register' %}" class="nav-link"><div class="box register-box">Register</div></a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
