{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block css %}     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock css %} 

{% block title %}Register{% endblock title %}

{% block content %}
<div class="container">
        <form method="post">
        {% csrf_token %}
        {{ register_form|crispy }}
        <button type="submit" class="btn btn-primary mt-3">Register</button>
    </form>
</div>
{% endblock content %}
